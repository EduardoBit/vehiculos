server.port=8080

# ====================================================================
# CONFIGURACIÓN ACTIVA: Base de Datos MySQL
# ====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/vehiculos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA (Crea y actualiza automáticamente las tablas según las entidades Java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar consola H2
spring.h2.console.enabled=false

