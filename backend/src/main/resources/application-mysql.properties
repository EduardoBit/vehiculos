server.port=8080

# =====================================================
# CONFIGURACIÓN PARA MYSQL
# =====================================================
# Asegúrate de crear primero la base de datos en MySQL:
# CREATE DATABASE vehiculos_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

spring.datasource.url=jdbc:mysql://localhost:3306/vehiculos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creará y actualizará automáticamente las tablas (vehiculos y usuarios)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar consola H2 en entorno MySQL
spring.h2.console.enabled=false

# Clave secreta JWT y Expiración (24 horas)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
