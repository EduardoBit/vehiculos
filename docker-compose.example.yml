version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: vehiculos-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:vehiculos_db}
    ports:
      - "${MYSQL_PORT:3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:123456}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehiculos-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vehiculos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:123456}
      JWT_SECRET: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: 86400000
    ports:
      - "${BACKEND_PORT:8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vehiculos-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:4200}:80"
    restart: unless-stopped

volumes:
  mysql_data:
